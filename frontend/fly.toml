# Fly.io config for the EngineerGPT frontend (Next.js standalone).
# App name must be globally unique — change it if `engineergpt-web` is taken.
# Deploy from the frontend/ directory, passing the backend URL as a build arg:
#   fly deploy --build-arg NEXT_PUBLIC_API_BASE_URL=https://engineergpt-api.fly.dev
app = "engineergpt-web"
primary_region = "iad"   # keep the same region as the backend

[build]
  dockerfile = "Dockerfile"
  [build.args]
    # Overridden at deploy time with --build-arg to point at the live backend.
    NEXT_PUBLIC_API_BASE_URL = "https://engineergpt-api.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
